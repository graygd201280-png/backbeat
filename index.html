  if(division%2 && position===division-1) return base;
  const push=pattern.swing/100;
  return base*(1+(position%2===0?push:-push));
}

let context, liveKit, auditionKit, interval, cursor, timeline=[], running=false, startRequest=0;
let lit=[];
function clearPlayhead(){
  lit.forEach(node=>node.classList.remove('current','playing'));
  lit=[];
}
async function audioReady(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio) throw new Error('Web Audio is unavailable in this browser.');
  context ||= new Audio();
  if(context.state!=='running') await context.resume();
  return context;
}
function transportUI(){
  $('play').textContent=t(running?'■ Stop':'▶ Play');
  if(!running) $('readout').textContent=t('STOPPED');
}
function disposeKit(kit){
  const now=kit.ctx.currentTime;
  kit.gate.gain.setTargetAtTime(0,now,.003);
  kit.voices.forEach(voice=>{try{voice.stop(now+.014);}catch{}});
  setTimeout(()=>kit.gate.disconnect(),30);
}
function stop(){
  startRequest++;
  running=false;
  clearInterval(interval);
  if(liveKit){disposeKit(liveKit);liveKit=null;}
  timeline=[];
  cancelAnimationFrame(raf);
  lastFrame=frameId=null;
  clearPlayhead();
  transportUI();
  renderView();
}
function begin(withCount){
  liveKit=createKit(context);
  const bar=soloBar??0;
  cursor={bar,step:0,count:withCount?0:null,t:context.currentTime+.07};
  running=true;
  transportUI();
  schedule();
  interval=setInterval(schedule,25);
  raf=requestAnimationFrame(draw);
}
async function toggle(){
  if(running){stop();return;}
  const request=++startRequest;
  try{
    await audioReady();
    if(request===startRequest) begin(countIn);
  }catch(error){status(error.message);}
}
function nextBar(bar){
  return soloBar??((bar+1)%state.bars.length);
}
function replaceBar(index,bar){
  const old=state.bars[index];
  state.bars[index]=bar;
  if(!running||cursor.bar!==index) return;
  if(cursor.count!==null){
    if(cursor.count>=bar.beats) cursor.count=null;
    return;
  }
  // Leave scheduled attacks and tails intact. Map the first unscheduled
  // onset onto the new grid at the same beat position or the next step.
  const position=stepPosition(old,cursor.step,state.swing);
  const steps=bar.beats*perBeat(bar);
  let step=Math.min(steps,Math.floor(position*perBeat(bar)));
  while(step<steps&&stepPosition(bar,step,state.swing)<position-1e-9) step++;
  cursor.t+=Math.max(0,stepPosition(bar,step,state.swing)-position)*beatDuration(state,bar);
  cursor.bar=step===steps?nextBar(index):index;
  cursor.step=step===steps?0:step;
}
function stepPosition(bar,step,swing){
  const division=perBeat(bar);
  return (step+(step%division%2?swing/100:0))/division;
}
function loopBar(index){
  soloBar=soloBar===index?null:index;
  selectedBar=index;
  if(running&&soloBar!==null&&cursor.bar!==index){
    cursor.bar=index;
    cursor.step=0;
    if(cursor.count!==null) cursor.count=0;
  }
  $('bars').querySelectorAll('[data-action="solo"]').forEach((control,i)=>
    control.setAttribute('aria-pressed',i===soloBar));
  renderView();
}
function schedule(){
  const now=context.currentTime;
  // Keep only the latest elapsed marker while animation frames are paused.
  while(timeline.length>1 && timeline[1].t<=now) timeline.shift();
  // Rebase after a suspended or heavily throttled tab, avoiding a burst of overdue hits.
  if(cursor.t<now-.04) cursor.t=now+.02;
  while(cursor.t<now+.115){
    const {bar,step,count,t}=cursor, measure=state.bars[bar];
    const audioTime=Math.max(t,now+.002);
    if(count!==null){
      clickSound(liveKit,audioTime,count===0);
      cursor.t+=beatDuration(state,measure);
      cursor.count=count+1===measure.beats?null:count+1;
    }else{
      playStep(liveKit,state,bar,step,audioTime);
      if(metronome&&step%perBeat(measure)===0) clickSound(liveKit,audioTime,step===0);
      cursor.t+=stepDuration(state,measure,step);
      cursor.step++;
      if(cursor.step===measure.beats*perBeat(measure)){
        cursor.step=0;
        cursor.bar=nextBar(bar);
      }
    }
    timeline.push({bar,step,count,beats:measure.beats,division:perBeat(measure),t:audioTime});

}
let lastFrame=null, frameId;
function draw(){
  if(!running) return;
  while(timeline.length&&timeline[0].t<=context.currentTime) lastFrame=timeline.shift();
  if(lastFrame&&lastFrame!==frameId){
    frameId=lastFrame;
    clearPlayhead();
    const {bar,step,count,beats,division}=lastFrame;
    if(singleBar&&followPlayhead&&bar!==selectedBar&&state.bars[bar]) selectBar(bar);
    else [...$('bar-tabs').children].forEach((tab,i)=>tab.classList.toggle('is-playing',i===bar&&count===null));
    const card=$('bars').children[bar];
    if(count!==null){
      $('readout').textContent=t('COUNT-IN')+' · '+(count+1)+' / '+beats;
    }else if(card){
      const measure=state.bars[bar], currentStep=Math.floor(step*perBeat(measure)/division);
      const visibleStep=currentStep<measure.hits[0].length;
      $('readout').textContent=t('BAR')+' '+(bar+1)+(visibleStep?' · '+t('STEP')+' '+(currentStep+1):'');
      lit=[card,...card.querySelectorAll('[data-col="'+currentStep+'"]')];
      lit.forEach((node,i)=>node.classList.add(i?'current':'playing'));
      if(!card.hidden&&(soloBar!==null||(singleBar&&followPlayhead))){
        const scroll=card.querySelector('.grid-scroll');
        const cell=lit[1];
        if(cell&&cell.offsetLeft+cell.offsetWidth>scroll.scrollLeft+scroll.clientWidth)
          scroll.scrollLeft=cell.offsetLeft-scroll.clientWidth+cell.offsetWidth;
        if(currentStep===0) scroll.scrollLeft=0;
      }
    }
  }
  raf=requestAnimationFrame(draw);
}
let raf;
async function audition(row,velocity,barIndex){
  try{
    await audioReady();
    auditionKit ||= createKit(context);
    playVoice(auditionKit,state,Math.min(barIndex,state.bars.length-1),0,row,context.currentTime+.006,velocity,true);
  }catch(error){status(error.message);}
}

function alterGrid(bar,key,value){
  const next=createBar(key==='beats'?value:bar.beats,key==='unit'?value:bar.unit,
    key==='subdivision'?value:bar.subdivision);
  next.notes=bar.notes.slice();
  const oldStep=4/(bar.unit*perBeat(bar)), newStep=4/(next.unit*perBeat(next));
  const priority=[0,2,3,1];
  bar.hits.forEach((row,track)=>row.forEach((hit,step)=>{
    const target=Math.round(step*oldStep/newStep);
    if(target<next.hits[track].length&&priority[hit]>priority[next.hits[track][target]])
      next.hits[track][target]=hit;
  }));
  return next;
}
function generateFill(index){
  const old=state.bars[index];
  const bar=alterGrid(old,'subdivision',fillStyle===2?8:old.subdivision), division=perBeat(bar);
  bar.hits.slice(0,drumCount).forEach(row=>row.fill(0));
  const total=bar.hits[0].length;
  const start=Math.max(0,(bar.beats-(fillStyle===2?Math.ceil(bar.beats/2):2))*division);
  const pick=list=>list[Math.floor(Math.random()*list.length)];
  for(let step=0;step<start;step++){
    if(step%division===0) bar.hits[step%(2*division)===0?8:7][step]=2;
    if(step%Math.max(1,Math.floor(division/2))===0) bar.hits[3][step]=1;
  }
  const run=pick([[7,4,5,6],[4,7,5,6],[7,5,4,6]]);
  for(let step=start;step<total;step++){
    const progress=(step-start)/(total-start);
    if(fillStyle===2&&progress<.42&&(step-start)%2) continue;
    if(fillStyle!==2&&step!==total-1&&step%division!==0&&Math.random()<.13) continue;
    const row=fillStyle===0?run[Math.floor(progress*4)]:fillStyle===1?
      (step%2?pick([7,7,4,5,6]):pick([8,8,7])):progress<.65?7:pick([7,4,5,6]);
    bar.hits[row][step]=step===total-1||step%division===0?2:row===7&&Math.random()<.45?3:1;
  }
  if(transition===1||transition===3) bar.hits[riserRow][total-division]=1;
  if(transition===2||transition===3) bar.hits[impactRow][total-1]=2;
  if(transition===4) bar.hits[pick([9,10,11])][total-1]=2;
  replaceBar(index,bar);
  render();
  const style=styles[fillStyle], effect=transition?transitions[transition]:null;
  status('{0} generated{1}.',()=>t(style),()=>effect?' · '+t(effect):'');
}
function setStep(button,value){
  const {row,step}=button.dataset;
  const bar=+button.closest('.bar').dataset.bar;

}
const stepButton=target=>target.closest?.('.step');
let drag;
$('bars').addEventListener('pointerdown',event=>{
  const pad=stepButton(event.target);
  if(!pad||event.button!==0||!event.isPrimary) return;
  event.preventDefault();
  pad.focus({preventScroll:true});
  const value=(+pad.dataset.v+1)%4;
  drag={id:event.pointerId,value,seen:new Set([pad]),last:pad};

window.addEventListener('pointermove',event=>{
  if(!drag||drag.id!==event.pointerId) return;
  const pad=stepButton(document.elementFromPoint(event.clientX,event.clientY));
  if(!pad||drag.seen.has(pad)) return;
  const last=drag.last;
  if(last.dataset.row===pad.dataset.row&&last.closest('.bar')===pad.closest('.bar')){
    const row=pad.dataset.row, low=Math.min(+last.dataset.step,+pad.dataset.step), high=Math.max(+last.dataset.step,+pad.dataset.step);
    for(let step=low;step<=high;step++){
      const cell=pad.closest('.bar').querySelector('.step[data-row="'+row+'"][data-step="'+step+'"]');
      if(!drag.seen.has(cell)){setStep(cell,drag.value);drag.seen.add(cell);}
    }
  }else{setStep(pad,drag.value);drag.seen.add(pad);}
  drag.last=pad;
});
for(const type of ['pointerup','pointercancel','blur']) window.addEventListener(type,()=>{drag=null;});
$('bars').addEventListener('contextmenu',event=>{
  const pad=stepButton(event.target);

});
$('bars').addEventListener('click',event=>{
  const pad=stepButton(event.target);

    const value=(+pad.dataset.v+1)%4;

  }
  const control=event.target.closest('[data-action]');

  switch(control.dataset.action){
    case 'preview': audition(+control.dataset.row,1,index);return;

    case 'paste': if(barClip){replaceBar(index,clone(barClip));status('Pasted into Bar {0}.',index+1);}break;
    case 'clear': bar.hits.forEach(row=>row.fill(0));status('Bar {0} cleared.',index+1);break;
    case 'left': bar.hits.forEach(row=>row.push(row.shift()));break;

$('bars').addEventListener('change',event=>{

/* Presets and interchange. Imported data is validated before replacing the editor. */
function validatedPattern(data){
  const integer=(value,low,high)=>Number.isInteger(value)&&value>=low&&value<=high;
  if(!data||!integer(data.bpm,30,300)||!integer(data.swing,0,65)||
    !Array.isArray(data.bars)||!integer(data.bars.length,1,8)||
    !Array.isArray(data.mixer)||![drumCount,tracks.length].includes(data.mixer.length))
    throw new Error('Invalid pattern settings.');
  const channels=data.mixer.length;
  const bars=data.bars.map(bar=>{
    if(!bar||!integer(bar.beats,3,7)||![4,8].includes(bar.unit)||
      !resolutions.some(([n])=>n===bar.subdivision)||!Array.isArray(bar.hits)||
      bar.hits.length!==channels||bar.hits.some(row=>!Array.isArray(row)||
        row.length!==bar.beats*perBeat(bar)||row.some(hit=>!integer(hit,0,3))))
      throw new Error('Invalid bar or step data.');
    if(bar.notes!==undefined&&(!Array.isArray(bar.notes)||bar.notes.length!==noteTracks.length||
      bar.notes.some(note=>!integer(note,-12,12)))) throw new Error('Invalid bar notes.');
    const next=createBar(bar.beats,bar.unit,bar.subdivision);
    bar.hits.forEach((row,index)=>{next.hits[index]=row.slice();});
    if(bar.notes) next.notes=bar.notes.slice();
    return next;
  });
  const mixer=data.mixer.map(track=>{
    if(!track||!integer(track.volume,0,120)||!integer(track.pitch,-12,12)||
      typeof track.mute!=='boolean'||typeof track.solo!=='boolean')
      throw new Error('Invalid mixer settings.');
    return {volume:track.volume,pitch:track.pitch,mute:track.mute,solo:track.solo};
  });
  mixer.push(...createMixer().slice(channels));
  return {bpm:data.bpm,swing:data.swing,bars,mixer};
}
const storageKey='backbeat.presets.v1';

try{
  const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');
  if(Array.isArray(saved)) presets=saved.flatMap(entry=>{

      if(typeof entry.name==='string') return [{name:entry.name,state:validatedPattern(entry.state)}];
    }catch{}
    return [];
  });
}catch{}

function download(blob,extension){
  const url=URL.createObjectURL(blob), link=document.createElement('a');
  const filename=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'backbeat';
  link.href=url;
  link.download=filename+'.'+extension;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

};
function encodeWav(buffer,start,length){
  const channels=buffer.numberOfChannels, bytes=length*channels*2;
  const wav=new DataView(new ArrayBuffer(44+bytes));
  function tag(offset,name){
    for(let i=0;i<name.length;i++) wav.setUint8(offset+i,name.charCodeAt(i));
  }
  tag(0,'RIFF');wav.setUint32(4,36+bytes,true);tag(8,'WAVE');tag(12,'fmt ');
  wav.setUint32(16,16,true);wav.setUint16(20,1,true);wav.setUint16(22,channels,true);
  wav.setUint32(24,buffer.sampleRate,true);wav.setUint32(28,buffer.sampleRate*channels*2,true);
  wav.setUint16(32,channels*2,true);wav.setUint16(34,16,true);tag(36,'data');wav.setUint32(40,bytes,true);
  const samples=Array.from({length:channels},(_,channel)=>buffer.getChannelData(channel));
  let offset=44;
  for(let frame=0;frame<length;frame++){
    for(const channel of samples){
      const sample=clamp(channel[start+frame],-1,1);
      wav.setInt16(offset,sample*(sample<0?32768:32767),true);
      offset+=2;
    }
  }
  return new Blob([wav.buffer],{type:'audio/wav'});
}
$('wav').onclick=async()=>{
  const control=$('wav'), pattern=clone(state);
  control.disabled=true;
  status('Rendering full loop…');
  try{
    const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!Offline) throw new Error('Offline Web Audio is unavailable.');
    const sampleRate=44100;
    const seconds=pattern.bars.reduce((total,bar)=>total+beatDuration(pattern,bar)*bar.beats,0);
    const frames=Math.round(seconds*sampleRate), loopTime=frames/sampleRate;
    const offline=new Offline(2,frames*2,sampleRate), kit=createKit(offline);
    // Prime the compressor and preserve tails across the loop boundary.
    for(let cycle=0;cycle<2;cycle++){
      let t=cycle*loopTime;
      pattern.bars.forEach((bar,index)=>{
        bar.hits[0].forEach((_,step)=>{
          playStep(kit,pattern,index,step,t);
          t+=stepDuration(pattern,bar,step);
        });
      });
    }
    const buffer=await offline.startRendering();
    download(encodeWav(buffer,frames,frames),'wav');
    status('WAV exported · {0} s.',seconds.toFixed(2));
  }catch(error){status('WAV export failed. {0}',()=>t(error.message));}
  finally{control.disabled=false;}
};
